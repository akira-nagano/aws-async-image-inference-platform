name: deploy-dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.0
          install: true
          cache: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv pip install --python "$VIRTUAL_ENV/bin/python" -r services/inference/requirements-dev.txt
      - run: mise run check
      - name: Prepare catalog model assets
        run: |
          python scripts/prepare-abo-catalog.py --accept-license --products 30
          python scripts/fetch-dinov2-model.py
          uv pip install --python "$VIRTUAL_ENV/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu" \
            "torchvision==0.28.0+cpu"
          uv pip install --python "$VIRTUAL_ENV/bin/python" -r services/inference/requirements-catalog.txt
          python scripts/build-product-catalog.py local/data/abo-catalog/catalog-source.json
      - run: mise run deploy-dev
      - name: Generate frontend runtime configuration
        run: |
          mkdir -p .artifacts
          aws cloudformation describe-stacks --stack-name ImgFlow-dev \
            --query 'Stacks[0].Outputs' --output json > .artifacts/outputs-list.json
          python - <<'PY'
          import json
          source=json.load(open('.artifacts/outputs-list.json'))
          json.dump({x['OutputKey']:x['OutputValue'] for x in source}, open('.artifacts/outputs.json','w'), indent=2)
          PY
          python scripts/generate-web-config.py --outputs .artifacts/outputs.json --output apps/web/public/config.json
      - run: mise run deploy-web
