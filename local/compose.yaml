services:
  floci:
    image: floci/floci:1.5.33
    container_name: imgflow-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_DEFAULT_REGION: ap-northeast-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_SERVICES_ECR_REGISTRY_BASE_PORT: "5200"
      FLOCI_SERVICES_ECR_REGISTRY_MAX_PORT: "5299"
      FLOCI_SERVICES_LAMBDA_DEFAULT_TIMEOUT_SECONDS: "30"
      FLOCI_SERVICES_LAMBDA_REGION_CONCURRENCY_LIMIT: "1000"
      FLOCI_SERVICES_SCHEDULER_TICK_INTERVAL_SECONDS: "5"
      QUARKUS_LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FLOCI_DATA_DIR:-./data}:/app/data

  floci-ui:
    image: floci/floci-ui:0.2.0@sha256:03a261144e0708993c8e48b763a0edb072415feae4325f254beeb1835fa424d9
    container_name: imgflow-floci-ui
    profiles: ["dev"]
    depends_on:
      - floci
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      PORT: "4500"
